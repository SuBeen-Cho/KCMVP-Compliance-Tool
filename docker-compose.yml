# KCMVP 사전 적합성 검증 도구 — Docker Compose (프로토타입)
# 사용: docker-compose up -d

version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./backend/rules:/app/rules:ro
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Celery worker (비동기 분석 사용 시)
  # worker:
  #   build: ./backend
  #   command: celery -A app.tasks.analyze_task worker -l info
  #   env_file: .env
  #   depends_on: [redis, backend]
