[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    tier1: Tier 1 AST checker tests (highest priority)
    tier2: Tier 2 AST checker tests
    tier3: Tier 3 AST checker tests
    rule_engine: Rule engine logic tests
    regression: Regression / golden file tests
    slow: Tests that take >10s (e.g. full pipeline)
