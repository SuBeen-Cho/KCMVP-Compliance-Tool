# 공통 보안 룰셋 (알고리즘/모드 무관)
# RAG 참조: database/LEA/03_소스코드_구성/03_02_보안_코딩/, 03_01_API_명명규칙/

rules:

  # ─────────────────────────────────────────────────
  # [PART 1] 잔존 정보 / SSP 보호
  # ─────────────────────────────────────────────────

  - id: COM-001
    name: "잔존 정보 제거(Zeroization)"
    category: common
    scope: project
    description: "암호 키·IV·라운드키·중간 연산 데이터 등 민감 정보가 저장된 메모리 영역은 사용 후 memset_s, SecureZeroMemory, explicit_bzero 등 최적화 방지가 보장된 함수로 즉시 0화해야 함. 일반 memset은 컴파일러 최적화에 의해 제거될 수 있음"
    pattern_type: "missing"
    pattern: "(memset_s|SecureZeroMemory|explicit_bzero|RtlSecureZeroMemory|lea_module_zeroize)"
    context: "키/IV/plaintext 버퍼 사용 직후"
    severity: high
    kcmvp_ref: "KS X ISO/IEC 19790:2015 §7.9 [09.01]"

  # ─────────────────────────────────────────────────
  # [PART 2] 에러 처리
  # ─────────────────────────────────────────────────

  - id: COM-002
    name: "에러 처리 및 통일 에러 코드"
    category: common
    description: "암호 연산 함수는 실패 시 음수(일반적으로 -1)를 반환하고, 호출자는 반드시 반환값을 검사해야 함. 에러 메시지에 구체적 실패 원인(패딩 오류, 키 길이 오류 등)을 외부에 노출하지 않아야 하며, 동일한 에러 코드를 반환하여 오라클 공격을 방지함"
    pattern_type: regex
    pattern: "void\\s+\\w+\\s*\\([^)]*\\)[^{]*\\{[^}]*\\blea_set_key\\s*\\("
    severity: medium
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §4.3.12"

  # ─────────────────────────────────────────────────
  # [PART 3] 키/IV 하드코딩 금지
  # ─────────────────────────────────────────────────

  - id: COM-003
    name: "하드코딩된 키/IV 금지"
    category: common
    description: "암호 키 또는 IV가 소스코드에 상수(리터럴)로 포함되어서는 안 됨. 키 자료는 파일, KMS, HSM 등 외부 소스에서 런타임에 주입해야 함. 허용 예외: 키 스케줄 공개 상수(delta), 검증용 테스트 벡터(KAT)"
    pattern_type: regex
    pattern: "(?:(?:static|const|extern|volatile)\\s+)*(?:unsigned\\s+)?(?:int|char|uint\\d+_t)\\s+\\w+\\s*(?:\\[[^\\]]*\\])+\\s*=\\s*\\{(?=[^;]*(?:0x[0-9a-fA-F]+[^;]*){8,})(?:[^{}]|\\{[^{}]*\\})*\\}"
    severity: high
    kcmvp_ref: "암호기술 구현안내서"

  # ─────────────────────────────────────────────────
  # [PART 4] 난수 생성
  # ─────────────────────────────────────────────────

  - id: COM-004
    name: "CSPRNG 사용 의무화"
    category: common
    description: "IV, Nonce, 키 생성 등 암호 연산에 사용되는 모든 난수는 DRBG 또는 운영체제 CSPRNG(getrandom, /dev/urandom, BCryptGenRandom)를 사용해야 함. rand(), srand(), random(), drand48(), clock(), time() 등 비암호학적 함수는 암호 목적 금지"
    pattern_type: regex
    pattern: "\\b(rand|srand|drand48)\\s*\\(|\\brandom\\s*\\(\\s*\\)|\\bclock\\s*\\(\\s*\\)|\\btime\\s*\\(\\s*NULL\\s*\\)"
    severity: high
    kcmvp_ref: "암호기술 구현안내서"

  # ─────────────────────────────────────────────────
  # [PART 5] 온라인(스트리밍) API 호출 규칙
  # ─────────────────────────────────────────────────

  - id: COM-005
    name: "온라인 API 호출 순서(init→update→final) 준수"
    category: common
    description: "대용량 데이터의 스트리밍 처리 시 lea_online_init → lea_online_update(반복) → lea_online_final 순서를 반드시 준수해야 함. init 전에 update를 호출하거나, final 없이 종료하면 미처리 데이터가 남거나 SSP가 제로화되지 않을 수 있음"
    pattern_type: semantic
    pattern: "lea_online_init|lea_online_update|lea_online_final"
    severity: high
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §4.3.12~§4.3.15"

  - id: COM-006
    name: "암호 함수 표준 명칭(lea_*) 사용"
    category: common
    pattern_type: regex
    pattern: "\\b(?:int|void|static\\s+int|static\\s+void)\\s+(?!lea_)\\w+(?:encrypt|decrypt|_enc\\b|_dec\\b)\\s*\\("
    severity: medium
    description: "국보연 배포 매뉴얼에서 정의한 표준 함수명(lea_cbc_enc, lea_ctr_enc 등 lea_ 접두사 사용) 대신 비표준 명칭(my_lea_encrypt, encrypt_cbc, run_cbc_enc 등)으로 암호 함수를 정의하면 안 됨"
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §4.3"
