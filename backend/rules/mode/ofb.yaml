# OFB(Output Feedback) 모드 특화 룰셋
# 대상: LEA 블록암호를 OFB 운영모드로 사용하는 C/Java/Python 구현체
#
# RAG 참조: database/LEA/02_운영모드/02_07_OFB/OFB_001_기본_구조.md

rules:

  - id: OFB-001
    category: mode
    mode: OFB
    name: "OFB IV 길이 16바이트 및 유일성"
    pattern_type: regex
    pattern: '(?i)(uint8_t|unsigned\s+char)\s+iv\s*\[\s*(?!16\s*\])\d+\s*\]'
    severity: high
    description: "OFB 모드의 IV 길이는 블록 길이인 16바이트여야 하며, 동일 키로 IV를 재사용하면 동일 키스트림이 생성되어 XOR 기반 평문 노출 위험이 발생하므로 매 호출마다 유일한 IV를 DRBG로 생성해야 함"
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §4.3.10, §4.3.11"

  - id: OFB-002
    category: mode
    mode: OFB
    name: "OFB 키스트림 생성 수식 준수"
    pattern_type: ast
    severity: high
    description: "OFB 키스트림은 OT[i] = ENC(Key, OT[i-1]), OT[0] = IV 수식으로 생성해야 하며, 암호문은 CT[i] = PT[i] ⊕ OT[i]이다. 암호화와 복호화 구조가 완전히 동일하며 ENC 함수만 사용함 (DEC 불필요)"
    fallback_pattern: '(?i)(ofb_enc|ofb_dec|lea_ofb|OFB_encrypt|output_block\s*\[|keystream\s*\[|ofb_block)'
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §4.3.10, §4.3.11"

  # OFB-LEA-001 제거: KISA API 명칭 강제 불필요 — 로직(구조) 검사만 수행
