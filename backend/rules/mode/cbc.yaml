# CBC 모드 특화 룰셋
# 대상: LEA 블록암호를 CBC 운영모드로 사용하는 C/Java/Python 구현체
#
# 알고리즘 공통 검사(uint32_t, S-box 배제 등)는 algorithm/lea.yaml에서 처리하므로
# 이 파일에는 CBC 모드 고유 규칙만 정의한다.

rules:

  # ─────────────────────────────────────────────────
  # [PART 1] 범용 CBC 운영모드 규칙
  # ─────────────────────────────────────────────────

  - id: CBC-001
    category: mode
    mode: CBC
    algorithm: LEA
    name: "CBC 암호화 연쇄(Chaining) 수식 준수"
    pattern_type: ast
    severity: high
    description: "CBC 암호화 수식 CT[i]=ENC(Key, PT[i]⊕CT[i-1])에 따라 현재 평문 블록과 이전 암호문 블록을 XOR(^)한 결과를 암호화 함수의 입력으로 사용해야 함"
    fallback_pattern: '(?i)(cbc_enc|lea_cbc|CBC_Encrypt|\bpt\s*\[.*\]\s*\^|\biv\s*\^|xor.*cipher|prev_ct)'
    kcmvp_ref: "LEA 검증시스템 §5.2"

  - id: CBC-002
    category: mode
    mode: CBC
    name: "CBC 복호화 연쇄(Chaining) 수식 준수"
    pattern_type: ast
    severity: high
    description: "CBC 복호화 수식 PT[i]=DEC(Key, CT[i])⊕CT[i-1]에 따라 복호화 함수의 출력과 이전 암호문 블록을 XOR(^)하여 평문을 복구해야 함"
    fallback_pattern: '(?i)(cbc_dec|lea_cbc_dec|CBC_Decrypt|\bpt\s*\[.*\]\s*=.*\^\s*ct|\bplain.*\^.*cipher)'
    kcmvp_ref: "LEA 검증시스템 §5.2"

  - id: CBC-003
    category: mode
    mode: CBC
    name: "중요 보안매개변수(SSP)의 관리 및 랜덤성 확보"
    pattern_type: missing
    pattern: "getrandom|/dev/urandom|BCryptGenRandom|DRBG|drbg"
    severity: high
    description: "IV와 같은 중요 보안매개변수는 예측 불가능하도록 검증대상 난수 발생기(DRBG)를 통해 생성되어야 하며, rand()/srand() 등 비암호학적 함수 사용은 금지됨"
    kcmvp_ref: "KS X ISO/IEC 19790:2015 §7.9.2 [09.06]"

  - id: CBC-004
    category: mode
    mode: CBC
    name: "중요 보안매개변수(IV/Key) 메모리 제거"
    pattern_type: missing
    pattern: "memset_s|SecureZeroMemory|explicit_bzero|RtlSecureZeroMemory"
    severity: medium
    description: "사용이 끝난 IV와 비밀키는 유출 방지를 위해 memset_s, SecureZeroMemory, explicit_bzero 등으로 메모리에서 즉시 0화(Zeroization)해야 함"
    kcmvp_ref: "KS X ISO/IEC 19790:2015 §7.9 [09.01]"

  - id: CBC-005
    category: mode
    mode: CBC
    name: "패딩 오라클 공격 방지 (에러 상세화 금지)"
    pattern_type: regex
    pattern: "(?i)(printf|fprintf|puts|cerr|cout|System\\.(out|err)|log(ger)?\\.).*[Pp]adding.*(error|invalid|fail)|return\\s+[-(]*(INVALID_PADDING|PADDING_ERR|BAD_PADDING)|#define\\s+\\w*(?:PADDING|PAD)\\w*\\s+\\(?\\s*-\\d+"
    severity: medium
    description: "복호화 실패 시 패딩 오류와 같은 구체적 원인을 외부에 노출하면 패딩 오라클 공격이 가능해지므로 실패 시에는 일반적인 음수 값만 반환해야 함"
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §4.3.12"

  # ─────────────────────────────────────────────────
  # [PART 2] LEA 전용 CBC 구현 규칙
  # ─────────────────────────────────────────────────

  - id: CBC-061
    category: mode
    mode: CBC
    name: "LEA 블록 크기에 따른 IV 길이 준수"
    pattern_type: regex
    pattern: "(?i)(uint8_t|unsigned\\s+char)\\s+\\w*iv\\w*\\s*\\[\\s*(?!16\\s*\\])\\d+\\s*\\]|new\\s+byte\\s*\\[\\s*(?!16\\s*\\])\\d+\\s*\\]"
    severity: high
    description: "LEA의 블록 크기인 128비트에 맞추어 IV의 길이는 반드시 16바이트여야 함. iv, short_iv_8, iv_6 등 IV 역할 배열 모두 포함"
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §2.2.2"

  # CBC-LEA-004 제거: KISA API 명칭 강제 불필요 — 로직(구조) 검사만 수행

  - id: CBC-LEA-005
    category: mode
    mode: CBC
    name: "LEA 전용 MCT-CBC 키 갱신 수식 준수"
    pattern_type: ast
    severity: high
    description: "몬테카를로 테스트 시 LEA의 키 길이에 따라 Key[i+1]=Key[i]⊕CT[j] 수식으로 정확한 키 갱신 로직을 수행해야 함"
    fallback_pattern: '(?i)(key\s*\[.*\]\s*\^=.*ct|CBC.*MCT|MCT.*CBC|cbc_mct|mct_cbc|key_upd|KeyUpdate)'
    kcmvp_ref: "LEA 검증시스템 §6.4"
