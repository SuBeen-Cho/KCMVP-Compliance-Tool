# CTR 모드 특화 룰셋
# 대상: LEA 블록암호를 CTR 운영모드로 사용하는 C/Java/Python 구현체
#
# 알고리즘 공통 검사(uint32_t, S-box 배제 등)는 algorithm/lea.yaml에서 처리하므로
# 이 파일에는 CTR 모드 고유 규칙만 정의한다.

rules:

  # ─────────────────────────────────────────────────
  # [PART 1] 범용 CTR 운영모드 규칙
  # ─────────────────────────────────────────────────

  - id: CTR-001
    category: mode
    mode: CTR
    name: "CTR 암·복호화 수식 및 대칭성 준수"
    pattern_type: ast
    severity: high
    description: "CTR 모드는 암호화와 복호화 과정에서 모두 암호화 알고리즘(ENC)만을 사용하여 평문/암호문을 생성해야 함"
    fallback_pattern: '(?i)(ctr_enc|ctr_dec|lea_ctr|CTR_encrypt|counter_block\s*\[|\bctr\s*\[|ctr_block)'
    kcmvp_ref: "LEA 검증시스템 §5.5"

  - id: CTR-002
    category: mode
    mode: CTR
    name: "카운터 초기값의 유일성(Nonce) 보장"
    pattern_type: ast
    severity: high
    description: "CTR 모드는 보안 유지를 위해 매 암호화 시마다 반드시 서로 다른 카운터 초기값을 사용해야 함"
    fallback_pattern: '(?i)(ctr_init|nonce_init|counter.*init|lea_ctr_init|\bnonce\s*\[|ctr_nonce|static\s+\w+\s+\w*counter\w*\s*\[|static\s+uint\d+_t\s+\w*counter\w*|static\s+(?:const\s+)?\w+\s+\w*ctr\w*\s*\[)'
    kcmvp_ref: "LEA 검증시스템 §5.5"

  - id: CTR-003
    category: mode
    mode: CTR
    name: "중요 보안매개변수(SSP)의 관리 및 랜덤성 확보"
    pattern_type: missing
    scope: project
    pattern: "getrandom|/dev/urandom|BCryptGenRandom|DRBG|drbg"
    severity: high
    description: "초기 카운터(Nonce)는 예측 불가능하도록 검증대상 난수 발생기(DRBG)를 통해 생성되어야 하며, rand()/srand() 등 비암호학적 함수 사용은 금지됨"
    kcmvp_ref: "KS X ISO/IEC 19790:2015 §7.9.2 [09.06]"

  - id: CTR-004
    category: mode
    mode: CTR
    name: "중요 보안매개변수(Counter/Key) 메모리 제거"
    pattern_type: missing
    scope: project
    pattern: "memset_s|SecureZeroMemory|explicit_bzero|RtlSecureZeroMemory|lea_memset"
    severity: medium
    description: "사용이 종료된 카운터 값과 비밀키는 메모리 유출 방지를 위해 즉시 0화(Zeroization)해야 함"
    kcmvp_ref: "KS X ISO/IEC 19790:2015 §7.9 [09.01]"

  - id: CTR-005
    category: mode
    mode: CTR
    name: "암호 알고리즘 소스코드 외 보안 요구사항 준수"
    pattern_type: ast
    severity: medium
    description: "단순 알고리즘 구현 외에 암호모듈 기준에서 요구하는 SSP 생성, 설정, 주입, 저장, 제로화 등 추가 보안 요구사항을 만족해야 함"
    fallback_pattern: '(?i)(lea_ctr_(enc|dec)|ctr_encrypt|ctr_decrypt|CTR_Encrypt|CTR_Decrypt)'
    kcmvp_ref: "KS X ISO/IEC 19790:2015 §7.9"

  # ─────────────────────────────────────────────────
  # [PART 2] LEA 전용 CTR 구현 규칙
  # ─────────────────────────────────────────────────

  - id: CTR-LEA-001
    category: mode
    mode: CTR
    name: "LEA 블록 크기에 따른 초기 카운터 길이 준수"
    pattern_type: regex
    pattern: "(?i)(uint8_t|unsigned\\s+char)\\s+\\w*ctr\\w*\\s*\\[\\s*(?!16\\s*\\])\\d+\\s*\\]|new\\s+byte\\s*\\[\\s*(?!16\\s*\\])\\d+\\s*\\]"
    severity: high
    description: "LEA의 블록 크기인 128비트에 맞추어 초기 카운터(CTR)의 길이는 반드시 16바이트여야 함. ctr, short_ctr_8, ctr_10, ctr_24 등 카운터 역할 배열 모두 포함"
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §2.2.3"

  - id: CTR-LEA-004
    category: mode
    mode: CTR
    name: "LEA 전용 API 'lea_ctr_enc/dec' 명칭 사용"
    pattern_type: regex
    pattern: "\\b(?:int|void|static\\s+int|static\\s+void)\\s+(?!lea_)\\w*(?:ctr|CTR)\\w*\\s*\\("
    severity: medium
    description: "국가보안기술연구소 배포 매뉴얼에서 정의한 LEA 전용 CTR 표준 인터페이스 함수명(lea_ctr_enc/dec)이 아닌 비표준 명칭(my_ctr_encrypt, ctr_encrypt, do_ctr_enc 등)으로 함수가 정의됨"
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §4.3.6, §4.3.7"

  - id: CTR-LEA-005
    category: mode
    mode: CTR
    name: "LEA CTR 모드 SIMD 가속 적용 권고"
    pattern_type: missing
    scope: project
    pattern: "(?i)\\blea_ctr.*(sse2|avx2|neon|simd)"
    severity: low
    description: "병렬 처리가 가능한 LEA CTR 모드의 특성을 활용하여 암·복호화 시 SIMD 가속 구현을 권장함"
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §3"

  - id: CTR-LEA-006
    category: mode
    mode: CTR
    name: "MCT-CTR 카운터 갱신 및 키 갱신 수식 준수"
    pattern_type: ast
    severity: high
    description: "몬테카를로 테스트 시 매 연산마다 카운터를 (CTR+1) mod 2^128로 증가시키고 결과 암호문으로 키를 갱신하는 LEA 전용 로직 확인"
    fallback_pattern: '(?i)(CTR.*MCT|MCT.*CTR|ctr_mct|mct_ctr|counter.*update.*mct|ctr_key_update|lea_mct_ctr|mmt_ctr_test|lea_mmt_ctr)'
    kcmvp_ref: "LEA 검증시스템 §6.4"
