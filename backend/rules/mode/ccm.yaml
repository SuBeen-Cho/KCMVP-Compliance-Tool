# CCM(Counter with CBC-MAC) 모드 특화 룰셋
# 대상: LEA 블록암호를 CCM 운영모드로 사용하는 C/Java/Python 구현체
#
# 알고리즘 공통 검사(uint32_t, S-box 배제 등)는 algorithm/lea.yaml에서 처리하므로
# 이 파일에는 CCM 모드 고유 규칙만 정의한다.
# RAG 참조: database/LEA/02_운영모드/02_04_CCM/CCM_001_구조_개요.md, CCM_002_Nonce_유일성.md

rules:

  # ─────────────────────────────────────────────────
  # [PART 1] 범용 CCM 운영모드 규칙
  # ─────────────────────────────────────────────────

  - id: CCM-001
    name: "CCM Nonce 유일성 보장"
    category: mode
    mode: CCM
    description: "CCM 모드에서 동일한 키로 Nonce를 재사용하면 CTR 키스트림이 반복되어 기밀성이 파괴되고, CBC-MAC 인증 보장도 무력화되므로 매 암호화 호출마다 반드시 고유한 Nonce를 사용해야 함"
    pattern_type: "ast"
    severity: high
    fallback_pattern: '(?i)(ccm_init|lea_ccm_init|ccm_nonce|\bnonce\s*\[.*ccm|CCM.*nonce|lea_ccm_enc)'
    kcmvp_ref: "암호모듈 구현안내서 §2.2.6"

  - id: CCM-002
    name: "CCM Nonce 길이 제약 (7~13바이트)"
    category: mode
    mode: CCM
    pattern_type: regex
    # 오탐 방지: 음수 lookahead 후 실제 길이 숫자(\\d+)를 소비하도록 구성
    # - 허용값(7~13)에는 매칭 실패
    # - 그 외 숫자에 대해서만 매칭 성공
    pattern: "(?i)(Nlen|nonce_?len|n_?len)\\s*[=<>!]+\\s*(?!(?:[7-9]\\b|1[0-3]\\b))\\d+\\b"
    severity: high
    description: "CCM Nonce 길이는 7~13바이트 범위만 허용됨. Nonce가 짧을수록 카운터 필드가 길어져 더 큰 메시지를 처리할 수 있지만 충돌 위험이 증가함"
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §4.3.16"

  - id: CCM-003
    name: "KCMVP CCM 인증값(Tag) 길이 제약 (14 또는 16바이트)"
    category: mode
    mode: CCM
    pattern_type: regex
    # 오탐 방지: 허용 길이 집합을 제외하고(negative lookahead) 실제 숫자(\\d+)를 소비
    pattern: "(?i)\\b(?:ccm_)?(?:tag_(?:len_)?(?:bytes?|bits?)|tag_len|t_len)\\s*(?:=|:)\\s*\\d+\\b"
    severity: high
    description: "KCMVP 검증대상 CCM의 인증값 길이는 14 또는 16바이트(112/128비트)이다. 일반 CCM 표준의 4/6/8/10/12바이트 허용과 KCMVP 프로파일을 구분한다. 단위가 명시되지 않은 tag_len/t_len은 LEA C API 관례에 따라 바이트로 처리한다."
    kcmvp_ref: "암호알고리즘 구현안내서(GVI Part 2, 2024.03) p.33~p.36"
    compliance_profile: "KCMVP-GVI-Part2-2024.03"
    value_unit_policy: "bytes:{14,16};bits:{112,128}"
    generic_standard_profile: "ISO-IEC-19772-CCM"

  - id: CCM-004
    name: "CCM 복호화 인증 실패 시 평문 폐기(0 채움)"
    category: mode
    mode: CCM
    pattern_type: regex
    pattern: "lea_ccm_decrypt\\s*\\([^;]+\\);(?:(?!memset)[^}])*\\}"
    severity: high
    description: "CCM 복호화 시 인증값이 불일치하면 -1을 반환하고, 복호화된 평문 버퍼를 반드시 0으로 채워(memset) 위조 데이터의 사용을 원천 차단해야 함"
    kcmvp_ref: "블록암호 LEA 소스코드 사용 매뉴얼(v1.0) §4.3.17"

  - id: CCM-005
    name: "CCM SSP(Nonce/Key) 메모리 제로화"
    category: mode
    mode: CCM
    pattern_type: missing
    pattern: "memset_s|SecureZeroMemory|explicit_bzero|RtlSecureZeroMemory"
    severity: medium
    description: "사용이 끝난 Nonce와 비밀키는 memset_s, SecureZeroMemory, explicit_bzero 등으로 메모리에서 즉시 0화(Zeroization)해야 함"
    kcmvp_ref: "KS X ISO/IEC 19790:2015 §7.9 [09.01]"

  # ─────────────────────────────────────────────────
  # [PART 2] LEA 전용 CCM 구현 규칙
  # ─────────────────────────────────────────────────

  # CCM-LEA-001 제거: KISA API 명칭 강제 불필요 — 로직(구조) 검사만 수행
