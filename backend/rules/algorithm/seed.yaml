rules:
- id: SEED-001
  category: algorithm
  algorithm: SEED
  name: SEED 명시적 비밀키 배열 길이 검증
  pattern_type: ast
  severity: high
  description: SEED의 비밀키는 128비트(16바이트)이다. 바이트형 비밀키 배열의 크기가 정수 리터럴로 명시된 경우에만 16바이트 여부를 판정하며, 포인터·래퍼·동적 길이처럼 정적으로 확정할 수 없는 구현은 판정을 보류한다.
  kcmvp_ref: KISA 검증대상 암호알고리즘; IETF RFC 4269 §1.2
  source_metadata:
    key_bytes: 16
    kisa_url: https://seed.kisa.or.kr/kisa/kcmvp/EgovVerification.do
    kisa_role: KCMVP 검증대상 및 참조표준 목록
    specification_url: https://www.rfc-editor.org/rfc/rfc4269.html
    specification_status: Informational RFC 교차검증 사양
    source_checked_on: '2026-08-11'
  limitations:
    - 명시적 바이트형 배열 선언만 검사한다.
    - 래퍼, 포인터, 전처리 후에도 해석되지 않는 매크로 및 런타임 길이는 unknown으로 처리하여 finding을 생성하지 않는다.
    - 라운드 수는 최적화 구현의 오탐 가능성 때문에 검사하지 않는다.
