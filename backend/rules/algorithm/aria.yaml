# ARIA 알고리즘 공통 룰셋
# 확장 시 사용 (Phase 4)

rules:
  - id: ARIA-001
    name: "ARIA 키 스케줄링"
    category: algorithm
    algorithm: ARIA
    description: "ARIA 키 확장 및 라운드 키 생성 검증"
    pattern_type: "ast"
    severity: high
    fallback_pattern: '(?i)(aria_set_key|AriaKeyExpansion|aria_key_schedule|aria_enc_key|\bCK\s*\[|aria_init)'
    kcmvp_ref: "ARIA 규격서"

  - id: ARIA-002
    name: "ARIA S-Box 사용"
    category: algorithm
    algorithm: ARIA
    description: "표준 S-Box 사용 여부"
    pattern_type: "ast"
    severity: high
    fallback_pattern: '(?i)(SB1\s*\[|SB2\s*\[|SB3\s*\[|SB4\s*\[|aria_sbox|ARIA_S\d|aria.*s_box)'
    kcmvp_ref: "ARIA 규격서"
