  pattern_type: ast
  severity: high
  description: MCT 수행 중 이전 키와 마지막 암호문 블록을 XOR하여 다음 키를 갱신하는 로직 검증
  fallback_pattern: '(?i)(key\s*\[.*\]\s*\^=|key_update|KeyUpdate|key\s*\^=\s*ct|\bkey\b.*\^.*cipher|xor_key_ct)'
  kcmvp_ref: LEA 검증시스템 §6.4
- id: LEA-058
  category: algorithm
  algorithm: LEA
  name: KAT용 REQUEST/RESPONSE 파일 명칭 준수
  pattern_type: missing
  pattern: (?i)LEA(128|192|256)(ECB|CBC|CTR|OFB|CFB\d*)(KAT|MMT|MCT)\.(req|rsp|fax)
  severity: high
  description: LEA[키길이][모드명][시험유형].[확장자] 형식의 표준 파일 명칭 체계를 준수해야 함
  kcmvp_ref: LEA 검증시스템 §6.2
  scope: project
- id: LEA-059
  category: algorithm
  algorithm: LEA
  name: 다중 블록 메시지 검사(MMT) 가변 블록 수 처리
  pattern_type: ast
  severity: medium
  description: MMT는 블록 수 1~10개(i×128비트)의 가변 길이 메시지를 순차 시험하는 로직이 필요함
  fallback_pattern: '(?i)(MMT|mmt_test|LEA.*MMT|mmt_loop)'
  kcmvp_ref: LEA 검증시스템 §6.3
  check_in: ["test", "benchmark"]
- id: LEA-060
  category: algorithm
  algorithm: LEA
  name: 기지 답안 검사(KAT)의 참조구현값 일치성
  pattern_type: missing
  scope: project
  pattern: "KAT|kat_result|test_vector|참조구현|known.answer"
  severity: high
  description: 고정된 입력값에 대해 표준 규격서 부록 I의 참조구현값과 출력이 일치하는지 확인
  kcmvp_ref: LEA 표준 규격서 부록 Ⅰ
- id: LEA-061
  category: algorithm
  algorithm: LEA
  name: LEA 허용 키 길이(128, 192, 256비트) 지원 검증
  pattern_type: semantic
  pattern: "(?i)(key_?len|mk_?len|keyLen)\\s*[=<>!]+\\s*(128|192|256|16|24|32)\\b|\\b(128|192|256)\\s*(?:bit|비트)"
  severity: high
  description: LEA 알고리즘은 규격에 따라 128, 192, 256 비트의 키 길이에 대응하는 암복호화 및 키 스케줄링을 지원해야 함
  kcmvp_ref: LEA 검증시스템 §6
- id: LEA-062
  category: algorithm
  algorithm: LEA
  name: 기지 답안 검사(KAT) REQUEST/RESPONSE 파일 처리
  pattern_type: missing
  scope: project
  pattern: Variable Key|Variable Text|KAT\.(req|rsp|fax)
  severity: high
  description: LEA 세부 구성요소 확인을 위해 Variable Key KAT 및 Variable Text KAT의 입력값(.req)을 읽고 결과값(.rsp)을 생성하는 기능이 구현되어야 함
  kcmvp_ref: LEA 검증시스템 §6.2
