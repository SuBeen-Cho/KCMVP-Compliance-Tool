# 문서 룰셋 (형상관리 문서용 DOC-2xx)
# 코드와 동일하게 pattern_type: missing/regex, pattern 필드 사용. 검사 대상은 doc_preprocess_result 풀텍스트.

rules:
  - id: CM-001
    doc_type: cm
    name: "형상관리 시스템 사용 및 명세 확인"
    description: "암호모듈 설계서, 소스코드, 암호모듈 등에 대해 자동화된 형상관리 시스템(SVN, GIT 등)을 설치·운영하고 있는지 명세되어야 함 (AS11.03)"
    pattern_type: "missing"
    pattern: '형상관리\s*시스템|SVN|GIT|git'
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS11.03"

  - id: CM-002
    doc_type: cm
    name: "형상항목 목록 및 유일 식별자(버전) 부여 방법 명세"
    description: "형상관리 시스템으로 관리되는 대상 항목(문서, 소스코드, 테스트 프로그램 등)을 나열하고, 각 항목에 Major/Minor 방식 등으로 유일한 버전을 부여 및 식별하는 방법이 문맥적으로 서술되어야 함 (AS11.04)"
    pattern_type: "semantic"
    pattern: '버전\s*부여|유일한\s*버전|버전.*식별|Major\s*Version|형상항목'
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS11.04"

  - id: CM-003
    doc_type: cm
    name: "형상항목 등록/변경/삭제 절차 및 이력 추적 명세"
    description: "형상관리위원회 등의 조직을 통한 형상항목의 등록, 수정 지시 및 검토, 삭제 절차와 시스템의 로그 기능을 활용하여 개정 이력을 추적하는 방법이 문맥적으로 명세되어야 함 (AS11.05)"
    pattern_type: "semantic"
    pattern: '형상항목.*(등록|수정|변경|삭제)|이력.*추적|로그\s*기능|형상관리위원회'
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS11.05"

  - id: CM-004
    doc_type: cm
    name: "안전한 배포, 설치, 초기화 및 삭제(소거) 절차 명세"
    description: "인가된 사용자에게 보안 USB 등으로 암호모듈을 배포하고, 설치 전 홈페이지 해시값을 대조하여 검증필 여부를 확인하는 절차와 수명 종료 시 안전하게 삭제(소거)하는 전체 절차가 문맥적으로 서술되어야 함"
    pattern_type: "semantic"
    pattern: '안전한\s*배포|해시값.*비교|검증필.*확인|설치.*경로|라이브러리.*삭제'
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 형상관리문서 4장 배포, 설치, 삭제"
