# 문서 룰셋 (설계서용 DOC-xxx)
# 코드와 동일하게 pattern_type: missing/regex, pattern 필드 사용. 검사 대상은 doc_preprocess_result 풀텍스트.

rules:
  - id: DOC-001
    doc_type: design
    name: "암호모듈 유형 및 판단근거 명세 확인"
    description: "암호모듈이 하드웨어, 소프트웨어, 펌웨어, 하이브리드 중 어떤 유형인지 정의되어야 하며, 해당 유형을 선택한 근거가 명세되어야 함 (AS02.03)"
    pattern_type: "missing"
    pattern: "암호모듈\\s*유형.*(하드웨어|소프트웨어|펌웨어|하이브리드)"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.03"

  - id: DOC-002
    doc_type: design
    name: "암호모듈 경계 및 구성요소 명세"
    description: "암호모듈의 구현물 경계 및 암호 경계를 포함하여, 경계 안의 모든 논리적/물리적 구성요소(예: dll, so 파일 등)가 명세되어야 함 (AS02.07)"
    pattern_type: "semantic"
    pattern: "암호\\s*경계|구현물\\s*경계|구성요소"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.07"

  - id: DOC-003
    doc_type: design
    name: "검증대상 암호알고리즘 및 핵심보안매개변수(CSP) 명세"
    description: "경계 내에 포함된 검증대상 암호알고리즘의 목록과 각 알고리즘에 연관된 핵심보안매개변수(비밀키, 라운드키 등)가 명세되어야 함 (AS02.09)"
    pattern_type: "semantic"
    pattern: "핵심\\s*보안매개변수|CSP.*비밀키|비밀키.*라운드키.*IV|CSP.*생성.*소멸"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.09"

  - id: DOC-004
    doc_type: design
    name: "암호모듈 명칭 및 버전 정보 명세"
    description: "암호모듈과 내부 구성요소를 식별할 수 있는 적절한 명칭과 버전 정보가 명시되어야 함 (AS02.11, AS02.12)"
    pattern_type: "missing"
    pattern: "버전\\s*정보|버전\\s*V\\d+"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.11, AS02.12"

  - id: DOC-005
    doc_type: design
    name: "소프트웨어/펌웨어 운영환경 명세"
    description: "암호모듈이 실행되는 컴퓨팅 플랫폼, 운영체제(Windows, Linux 등) 및 내부 소프트웨어 구조에 대한 개발 문서가 제출되어야 함 (AS02.16)"
    pattern_type: "semantic"
    pattern: "운영환경|운영체제|Windows|Linux|Ubuntu"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.16"

  - id: DOC-006
    doc_type: design
    name: "검증대상 동작모드 실행 및 천이 방법 명세"
    description: "암호모듈이 제공하는 검증대상 동작모드의 구조 및 절차와, 해당 모드를 실행(또는 천이)하기 위한 구체적인 방법이 문맥적으로 서술되어야 함"
    pattern_type: "semantic"
    pattern: "검증대상\\s*동작모드.*(실행|천이|호출|자동)"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.19"

  - id: DOC-007
    doc_type: design
    name: "탑재된 검증/비검증대상 암호알고리즘 목록 명세"
    description: "사전검토단계에서 구현적합성 검증을 수행할 '검증대상 암호알고리즘' 목록과 '비검증대상 암호알고리즘' 목록이 명세되어야 함"
    pattern_type: "missing"
    pattern: "(?=.*검증대상\\s*암호알고리즘)(?=.*비검증대상\\s*암호알고리즘)(?=.*목록)"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.20"

  - id: DOC-008
    doc_type: design
    name: "비검증대상 알고리즘의 동작 분리 근거 명세"
    description: "비검증대상 암호알고리즘이 검증대상 동작모드의 동작을 방해하지 않고 관련이 없다는 근거가 서술되거나, 비검증대상이 없음을 명확히 서술해야 함"
    pattern_type: "semantic"
    pattern: "비검증대상\\s*암호알고리즘.*(포함하지\\s*않|관련이\\s*없|영향)"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.21"

  - id: DOC-009
    doc_type: design
    name: "동작모드·서비스 간 CSP 독립적 분리 요구사항"
    description: "설계서에 동작모드 간 혹은 서비스 간 사용되는 CSP를 분리(예: 제로화 등)하여 독립적으로 관리하는 방법이 명세되어야 함"
    pattern_type: "missing"
    pattern: "동작모드.*CSP|서비스.*CSP|CSP.*독립|CSP.*분리"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.22"

  - id: DOC-010
    doc_type: design
    name: "서비스 상태 표시기(Indicator) 제공 명세"
    description: "검증대상 동작모드에서 제공하는 암호서비스(API 등)별로 성공, 실패 여부 및 현재 동작 상태를 확인할 수 있는 '표시기(상태 출력, 반환값 등)' 정보가 제공되어야 함"
    pattern_type: "missing"
    pattern: "표시기|상태\\s*출력|상태값|반환값|오류코드"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS02.24"

  # --- [4. 암호모듈 인터페이스] ---
  - id: DOC-011
    doc_type: design
    name: "물리적 포트 및 논리적 인터페이스 연관관계 명세"
    description: "암호모듈의 물리적 접근 지점(포트)과 4가지 논리적 인터페이스(데이터 입출력, 제어 입력, 상태 출력) 간의 연관관계 및 정보 흐름이 문맥적으로 명세되어야 함 (AS03.01, AS03.02)"
    pattern_type: "semantic"
    pattern: "물리적\\s*포트|논리적\\s*인터페이스|물리적\\s*접근\\s*지점"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS03.01, AS03.02"

  - id: DOC-012
    doc_type: design
    name: "서비스별 논리적 인터페이스 상세 명세"
    description: "암호모듈이 제공하는 각 암호 서비스(API)에 대해 데이터 입력, 데이터 출력(암호문·태그 등 출력 데이터), 제어 입력이 누락 없이 명세되어야 함 (AS03.08). 특히 암호화 API의 경우 '데이터 출력' 항목에 암호문(ciphertext)이 명시적으로 기재되어야 하며, 상태 출력(오류 코드)과 구별되어야 함. 섹션 2.3 등 다른 곳에서 '데이터 출력 금지' 언급은 이 요건 충족으로 보지 않음."
    pattern_type: "semantic"
    pattern: "데이터\\s*출력|출력\\s*데이터|반환\\s*데이터"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS03.04, AS03.05, AS03.06, AS03.08"

  - id: DOC-013
    doc_type: design
    name: "특정 상태 시 입출력 금지 보장 메커니즘 명세"
    description: "암호모듈이 자가시험, 제로화, 오류 상태에 있을 때 데이터 출력 및 제어 출력이 금지되는 구체적인 방법(예: API 내부 상태 체크 후 출력 통제)이 문맥적으로 명세되어야 함 (AS03.07, AS03.10)"
    pattern_type: "semantic"
    pattern: "데이터\\s*출력\\s*금지|제어\\s*출력\\s*금지|출력\\s*금지\\s*메커니즘"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS03.07, AS03.10"

  - id: DOC-014
    doc_type: design
    name: "상태 출력 및 오류 코드 식별 체계 명세"
    description: "암호모듈의 현재 동작 상태를 나타내는 변수 및 각 서비스 실패 시 반환되는 오류 코드가 '단순한 오류'와 '심각한 오류'로 명확히 구분되어 명세되어야 함 (AS03.11)"
    pattern_type: "missing"
    pattern: "상태\\s*출력|오류\\s*코드|단순한\\s*오류|심각한\\s*오류"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS03.11"

  - id: DOC-015
    doc_type: design
    name: "가변 길이 입력 및 데이터 형식 검증 명세"
    description: "안전한 동작을 보장하기 위해 가변 길이 데이터(평문, 암호문 등)에 대한 길이 제한 확인(예: 16의 배수 여부) 및 포인터 NULL 검사 등 입력 데이터 형식 검증 방법이 서술되어야 함 (AS03.15)"
    pattern_type: "semantic"
    pattern: "가변\\s*길이|길이\\s*확인|포인터\\s*NULL|형식\\s*검증"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS03.15"

  # --- [5. 역할, 서비스 및 인증] ---
  - id: DOC-016
    doc_type: design
    name: "동시 운영자 지원 여부 및 관리 명세"
    description: "암호모듈이 동시 운영자(Concurrent operator)를 지원하는지 여부와, 지원할 경우 각 동시 운영자에 대한 역할과 서비스를 구분하여 유지하는 방법이 명세되어야 함 (AS04.02)"
    pattern_type: "missing"
    pattern: "동시\\s*운영자"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.02"

  - id: DOC-017
    doc_type: design
    name: "암호 관리자 및 일반 사용자 역할 정의"
    description: "암호모듈이 인가하는 '암호 관리자'와 '일반 사용자' 역할을 명시적으로 구분하고, 각 역할이 수행할 수 있는 권한과 연관된 서비스가 명세되어야 함 (AS04.05, AS04.06)"
    pattern_type: "missing"
    pattern: "(?=.*암호\\s*관리자)(?=.*일반\\s*사용자)"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.05, AS04.06"

  - id: DOC-018
    doc_type: design
    name: "서비스별 상세 입출력 및 인가 역할 매핑 명세"
    description: "암호모듈이 제공하는 모든 암호 서비스(API) 각각에 대하여 목적/기능, 입력, 출력, 그리고 해당 서비스를 호출할 수 있는 '인가된 역할'이 서로 매핑되어 명세되어야 함 (AS04.11)"
    pattern_type: "semantic"
    pattern: "인가된\\s*역할.*(관리자|사용자)"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.11"

  - id: DOC-019
    doc_type: design
    name: "버전 정보 출력 서비스 제공 명세"
    description: "암호모듈 운영자에게 제공되는 기본 서비스 중, 암호모듈의 명칭과 버전 정보를 출력/반환하는 서비스(API 등)가 반드시 명세되어야 함 (AS04.13)"
    pattern_type: "missing"
    pattern: "버전.*출력|버전.*확인|버전\\s*정보"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.13"

  - id: DOC-020
    doc_type: design
    name: "상태 표시 및 확인 서비스 제공 명세"
    description: "암호모듈의 현재 상태와 서비스 수행에 대한 결과를 확인할 수 있는 '상태 표시 서비스(또는 상태확인 API)'가 일반 서비스로 제공됨이 명세되어야 함 (AS04.14)"
    pattern_type: "missing"
    pattern: "상태.*출력|상태.*확인|상태\\s*표시"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.14"

  - id: DOC-021
    doc_type: design
    name: "사용자 호출 방식의 동작 전 자가시험 명세"
    description: "암호모듈 초기화 시 자동 수행되는 것 외에도, 사용자가 원할 때 명시적으로 호출할 수 있는 '동작 전 자가시험 서비스(API)'가 명세되어야 함 (AS04.15)"
    pattern_type: "missing"
    pattern: "사용자.*동작\\s*전\\s*자가시험|동작\\s*전\\s*자가시험.*호출"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.15"

  - id: DOC-022
    doc_type: design
    name: "제로화 서비스 제공 및 동작 명세"
    description: "검증대상 동작모드에서 사용이 완료된 중요보안매개변수(CSP)를 안전하게 삭제하기 위해 제공되는 '제로화 서비스(제로화 API 등)'에 대한 동작이 명세되어야 함 (AS04.17). 단순히 함수명이 테이블에 나열되는 것으로는 부족하며, 제로화 서비스의 구체적인 동작(대상 CSP, 호출 방법, 동작 기술)이 서술되어야 함."
    pattern_type: "semantic"
    pattern: "lea_zeroize\\s*\\(|zeroize\\s*\\(|Zeroize\\s*\\(|제로화.*서비스.*동작|제로화.*대상.*CSP"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.17"

  - id: DOC-023
    doc_type: design
    name: "리셋/전원 종료 시 이전 인증 소멸 방법 명세"
    description: "암호모듈의 전원 종료, 재부팅, 리셋 시 운영자의 이전 인증 정보가 어떻게 소멸되는지(운영체제의 로그오프 메커니즘 의존 등) 그 방법이 서술되어야 함 (AS04.43)"
    pattern_type: "semantic"
    pattern: "인증.*소멸|이전\\s*인증.*제거|운영체제.*종료"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.43"

  - id: DOC-024
    doc_type: design
    name: "인증 데이터 보호 메커니즘 명세 확인"
    description: "암호모듈 내의 모든 인증 데이터를 노출, 수정, 대체로부터 보호하는 방법이 명세되거나, 자체 인증을 수행하지 않아 인증 데이터를 포함하지 않음이 서술되어야 함 (AS04.44)"
    pattern_type: "semantic"
    pattern: "인증\\s*데이터.*보호|자체적인\\s*인증메커니즘.*포함하지\\s*않"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.44"

  - id: DOC-025
    doc_type: design
    name: "운영체제 연계 암묵적/명시적 역할 할당 명세"
    description: "자체 인증 메커니즘이 없는 경우(보안수준 1), 암호모듈 운영환경(운영체제)의 인증을 통해 암호 관리자 및 일반 사용자로 '암묵적' 또는 '명시적' 역할이 할당되는 구조가 명세되어야 함 (AS04.56)"
    pattern_type: "semantic"
    pattern: "암묵적.*역할|명시적.*역할|역할\\s*할당|운영환경.*인증"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS04.56"

  # --- [6. 소프트웨어/펌웨어 보안] ---
  - id: DOC-026
    doc_type: design
    name: "소프트웨어 무결성 검증 기법 및 시험방법 명세"
    description: "소프트웨어 암호모듈의 무결성 검증을 위해 사용된 검증대상 무결성 기법(예: HMAC-SHA256, RSA-PSS 등)과 동작 전 자가시험 시 모듈 스스로 무결성을 검증하는 절차가 명세되어야 함"
    pattern_type: "semantic"
    pattern: "무결성\\s*기법|무결성\\s*시험|HMAC|RSA-PSS"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS05.02"

  - id: DOC-027
    doc_type: design
    name: "소프트웨어 무결성 검증키 분산 저장 및 보호 명세"
    description: "무결성 검증에 사용되는 키가 소프트웨어 암호모듈 내부에 저장될 때 인가되지 않은 노출을 막기 위한 방법(예: HMAC 키의 XOR 분산 하드코딩 등)이 문맥적으로 서술되어야 함"
    pattern_type: "semantic"
    pattern: "무결성\\s*검증키.*저장|분산\\s*저장|서명검증키.*저장"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS05.05"

  - id: DOC-028
    doc_type: design
    name: "소프트웨어 무결성 실패 시 오류 천이 및 임시 데이터 제로화 명세"
    description: "동작 전 자가시험 중 소프트웨어 무결성 검증에 실패할 경우 즉시 '심각한 오류 상태'로 천이된다는 명세와, 시험 과정 중 사용된 임시 버퍼(중간 데이터)가 완료 후 제로화된다는 내용이 포함되어야 함"
    pattern_type: "semantic"
    pattern: "무결성.*실패.*오류\\s*상태|중간\\s*데이터.*제로화|임시\\s*변수.*제로화"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS05.06"

  - id: DOC-029
    doc_type: design
    name: "운영자 요구에 의한 무결성 시험(온디맨드) API 제공 확인"
    description: "초기화 시 자동 수행되는 무결성 시험 외에도, 운영자의 요구(API 호출 등)에 따라 명시적으로 소프트웨어 무결성 시험을 수행할 수 있는 인터페이스(SFMI)가 제공되어야 함"
    pattern_type: "missing"
    pattern: "운영자.*요구.*무결성\\s*시험|무결성\\s*시험.*API"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS05.09"

  - id: DOC-030
    doc_type: design
    name: "소프트웨어의 안전한 배포 및 설치 전 무결성 확인 절차 서술"
    description: "소프트웨어 암호모듈이 배포된 후 도입기관에서 설치할 때, 제공받은 바이너리가 원본임을 확인하기 위해 시험기관 홈페이지 등에 공시된 '해시값'을 비교하여 검증필 여부를 판단하는 절차가 서술되어야 함"
    pattern_type: "semantic"
    pattern: "안전한\\s*배포|설치\\s*전.*변경|해시값.*비교|검증필.*확인"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS05.04"

  # --- [7. 운영환경 및 8. 중요 보안매개변수 관리 전반부] ---
  - id: DOC-031
    doc_type: design
    name: "운영환경(운영체제 및 버전/비트) 상세 정보 명세 확인"
    description: "암호모듈이 구동되는 변경 가능한 범용 운영환경의 운영체제 종류(Windows, Linux 등), 버전, 32/64비트 구조 등 환경 정보가 상세하게 명세되어야 함 (AS06.03)"
    pattern_type: "semantic"
    pattern: "운영체제.*비트|Windows.*bit|Linux.*bit|운영환경.*버전"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS06.03"

  - id: DOC-032
    doc_type: design
    name: "프로세스 및 가상 메모리 보호 메커니즘 명세 (SSP 독립 제어)"
    description: "암호모듈 인스턴스가 스스로의 SSP를 제어하고, 외부 프로세스로부터의 간섭 및 인가되지 않은 접근을 방지하기 위한 운영체제의 메모리 보호 메커니즘(가상 메모리 분리, ASLR, DEP 등)이 문맥적으로 서술되어야 함 (AS06.05, AS06.06)"
    pattern_type: "semantic"
    pattern: "가상\\s*메모리.*분리|프로세스.*보호|ASLR|DEP|간섭\\s*방지|접근\\s*방지"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS06.05, AS06.06"

  - id: DOC-033
    doc_type: design
    name: "암호모듈 생성 자식 프로세스의 소유권 제한 명세"
    description: "암호모듈 동작 중 추가적인 프로세스를 생성할 경우 그 소유권이 생성한 암호모듈로 국한된다는 점을 명세하거나, 혹은 모듈이 별도의 추가 프로세스를 생성하지 않음이 명확히 서술되어야 함 (AS06.08)"
    pattern_type: "semantic"
    pattern: "프로세스.*생성하지\\s*않|프로세스\\s*생성.*소유|자식\\s*프로세스"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS06.08"

  - id: DOC-034
    doc_type: design
    name: "CSP 및 PSP의 인가되지 않은 접근/변경/노출 보호 방법 서술"
    description: "암호모듈 내의 모든 핵심 보안매개변수(CSP) 및 공개 보안매개변수(PSP)가 인가되지 않은 접근, 사용, 노출, 변경 및 대체로부터 운영체제 보호 기능 등을 통해 어떻게 보호되는지 문맥적으로 명세되어야 함 (AS09.01, AS09.02)"
    pattern_type: "semantic"
    pattern: "인가되지\\s*않은.*(접근|사용|노출|변경|대체)|CSP.*보호|PSP.*보호"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS09.01, AS09.02"

  - id: DOC-035
    doc_type: design
    name: "난수발생기 상태 정보 및 키생성 중간값의 CSP 간주 명세"
    description: "일반적인 비밀키 뿐만 아니라, 난수발생기의 상태 정보(엔트로피, 시드값, V, Key) 및 키 생성 과정에서 발생한 중간값 등을 CSP로 엄격히 간주하고 사용 후 제로화하여 관리한다는 내용이 포함되어야 함 (AS09.04)"
    pattern_type: "semantic"
    pattern: "난수발생기.*상태.*CSP|엔트로피.*CSP|중간값.*CSP|CSP로\\s*간주"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS09.04"

  # --- [8. 중요 보안매개변수 관리 후반부] ---
  - id: DOC-036
    doc_type: design
    name: "외부 엔트로피 잡음원의 CSP 간주 및 평가 명세"
    description: "난수발생기 시드값을 구성하기 위해 암호 경계 외부에서 수집되는 엔트로피 잡음원을 CSP로 간주하여 관리(제로화 등)한다는 내용과, 잡음원 이름, 최종 엔트로피, 반복 사용 횟수 등의 평가 결과가 문맥적으로 명세되어야 함 (AS09.07, AS09.08)"
    pattern_type: "semantic"
    pattern: "엔트로피.*CSP|잡음원.*CSP|최종\\s*엔트로피|잡음원\\s*이름"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS09.07, AS09.08"

  - id: DOC-037
    doc_type: design
    name: "SSP 생성 및 자동화된 SSP 설정(합의/전송) 방법 명세"
    description: "검증대상 난수발생기를 이용한 SSP(비밀키, 키쌍 등) 생성 방법과, RSAES(키 전송) 또는 DH(키 합의)를 이용한 자동화된 SSP 설정(공유키 도출 등) 과정이 명세되어야 함 (AS09.09, AS09.10)"
    pattern_type: "semantic"
    pattern: "SSP\\s*생성.*난수발생기|자동화된.*SSP\\s*설정|키\\s*합의|키\\s*전송"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS09.09, AS09.10"

  - id: DOC-038
    doc_type: design
    name: "SSP 주입 및 출력 형태 명세"
    description: "암호모듈 경계를 넘어가는 SSP가 있을 경우 평문 또는 암호화된 형태의 주입/출력 방법이 명세되거나, S/W 라이브러리 특성상 내부/외부를 넘나드는 SSP가 없음이 명확히 서술되어야 함 (AS09.19)"
    pattern_type: "semantic"
    pattern: "SSP.*(주입|출력)|평문.*주입|암호화된.*출력|넘나드는\\s*SSP는\\s*없"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS09.19"

  - id: DOC-039
    doc_type: design
    name: "SSP 저장 및 PSP 보호(변경 금지) 명세"
    description: "인가되지 않은 운영자에 의한 PSP(공개키 등) 변경 금지와, 전원 차단 시에도 암호연산 수행을 위한 키(SSP) 저장 관리 기능의 지원 여부가 서술되어야 함 (AS09.25, AS09.27)"
    pattern_type: "semantic"
    pattern: "PSP\\s*변경\\s*금지|인가되지\\s*않은.*변경|키\\s*저장"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS09.25, AS09.27"

  - id: DOC-040
    doc_type: design
    name: "절차적/운영적 제로화 및 복구 불가능성 명세"
    description: "사용이 완료된 SSP가 복구될 수 없도록 '0'으로 덮어쓰는 방식 등의 '절차적 제로화'와 '운영적 제로화' 기법(컴파일러 최적화 방지를 위한 volatile 키워드 사용 등)이 구체적으로 명세되어야 함 (AS09.29)"
    pattern_type: "missing"
    pattern: "절차적\\s*제로화|운영적\\s*제로화|volatile.*Zeroize|복구될\\s*수\\s*없"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS09.29"

  # --- [9. 자가시험 전/중반부] ---
  - id: DOC-041
    doc_type: design
    name: "자가시험 실패 시 오류 처리 및 해제 방법 명세"
    description: "동작 전 자가시험 또는 조건부 자가시험 실패 시 발생하는 심각한 오류 상태에 대한 명칭, 발생 조건, 그리고 암호모듈 재시작/재설치 등을 통한 명확한 해제 방법이 문맥적으로 서술되어야 함 (AS10.07, AS10.08)"
    pattern_type: "semantic"
    pattern: "자가시험.*실패|오류\\s*발생\\s*조건|해제\\s*방법|재시작|재설치"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS10.07, AS10.08"

  - id: DOC-042
    doc_type: design
    name: "자가시험 오류 시 암호 서비스 제한 및 출력 금지 명세"
    description: "자가시험 오류가 해결되기 전까지 암호모듈이 암호 연산 및 관련 암호 서비스를 엄격히 제한하며, 제어 출력 및 데이터 출력을 금지하는 메커니즘이 명세되어야 함 (AS10.09, AS10.10)"
    pattern_type: "semantic"
    pattern: "오류\\s*상태.*서비스\\s*제한|자가시험.*오류.*해결되기\\s*전|출력\\s*금지|암호연산.*금지"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS10.09, AS10.10"

  - id: DOC-043
    doc_type: design
    name: "소프트웨어 무결성 시험 전 무결성 기술 자가시험 선행 명세"
    description: "동작 전 소프트웨어 무결성 시험을 수행하기 이전에, 해당 무결성 검증에 사용되는 기반 기술(예: HMAC, RSA-PSS 등)에 대한 핵심기능시험(KAT)이 반드시 선행된다는 절차가 서술되어야 함 (AS10.20)"
    pattern_type: "semantic"
    pattern: "무결성\\s*시험\\s*전.*알고리즘\\s*시험|무결성\\s*기술.*핵심기능시험|무결성\\s*기술.*KAT"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS10.20"

  - id: DOC-044
    doc_type: design
    name: "동작 전 핵심기능시험(KAT) 세부 수행 방법 명세"
    description: "탑재된 검증대상 암호알고리즘 각각에 대해 수행되는 동작 전 핵심기능시험(KAT)의 시험항목, 참조표준, 테스트벡터 출처 등이 누락 없이 명세되어야 함 (AS10.24)"
    pattern_type: "missing"
    pattern: "동작\\s*전\\s*핵심기능시험|KAT\\s*수행\\s*방법|테스트벡터|기지\\s*답안"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS10.24"

  - id: DOC-045
    doc_type: design
    name: "엔트로피 잡음원 건전성 시험 (오류 탐지 시험) 명세"
    description: "난수발생기가 잡음원을 수집할 때 오류를 탐지하기 위한 조건부 암호알고리즘 시험으로서, '반복 횟수 테스트' 및 '적응성 비율 테스트'와 같은 건전성 시험(오류 탐지 시험) 절차가 서술되어야 함 (AS10.34, AS10.25)"
    pattern_type: "missing"
    pattern: "반복\\s*횟수\\s*테스트|적응성\\s*비율\\s*테스트|Repetition\\s*Count|Adaptive\\s*Proportion|건전성\\s*시험"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS10.34, AS10.25"

  # --- [9. 자가시험 후반부 및 10. 생명주기 보증 전반부] ---
  - id: DOC-046
    doc_type: design
    name: "조건부 키쌍 일치 시험 수행 방법 명세"
    description: "공개키 기반 암호알고리즘(RSAES, RSA-PSS, DH 등)의 키쌍을 생성할 때, 암호화/복호화 또는 서명/검증 등을 통해 생성된 키쌍의 유효성을 검증하는 '조건부 키쌍 일치 시험' 절차가 문맥적으로 서술되어야 함 (AS10.35)"
    pattern_type: "semantic"
    pattern: "키쌍\\s*일치\\s*시험|조건부\\s*키쌍|키쌍\\s*유효성"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS10.35"

  - id: DOC-047
    doc_type: design
    name: "주기적 자가시험 제공 및 동작 명세"
    description: "초기화 시 자동 수행되는 동작 전 자가시험 외에도, 운영자의 서비스 요청이나 암호모듈 재시작 등을 통해 명시적으로 요구할 수 있는 '주기적 자가시험' 기능이 명세되어야 함 (AS10.53)"
    pattern_type: "missing"
    pattern: "주기적\\s*자가시험"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS10.53"

  - id: DOC-048
    doc_type: design
    name: "유한상태모델(상태천이도 및 상태천이표) 정의"
    description: "암호모듈의 전체 동작 과정을 명확히 설명하기 위해 필수 상태(전원 꺼짐/켜짐, 초기화, 동작 전 자가시험, 검증대상 동작, 오류 등)와 이벤트에 따른 천이 과정을 기술한 유한상태모델(상태천이도, 상태천이표)이 서술되어야 함 (AS11.08)"
    pattern_type: "missing"
    pattern: "유한상태모델|상태천이도|상태천이표"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS11.08"

  - id: DOC-049
    doc_type: design
    name: "단순 오류 발생 시 복구 및 자동 천이 절차 명세"
    description: "암호모듈이 심각한 오류 상태(자가시험 실패 등)가 아닌, 잘못된 키 사이즈 입력 등 운영자 실수로 인한 '단순한 오류' 상태일 경우 오류 코드를 반환하고 정상동작 모드로 자동 복구(천이)됨이 문맥적으로 서술되어야 함 (AS11.11)"
    pattern_type: "semantic"
    pattern: "단순한\\s*오류|복구.*가능|자동.*천이|정상.*천이"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS11.11"

  - id: DOC-050
    doc_type: design
    name: "소프트웨어 개발환경 및 빌드 도구 상세 명세"
    description: "암호모듈을 개발하기 위해 사용한 운영체제, 개발 도구(컴파일러, 링커 등), 런타임 라이브러리 및 적용된 컴파일 옵션(예: GCC, Visual Studio, 최적화 옵션 등) 정보가 상세히 명세되어야 함 (AS11.15, AS11.21)"
    pattern_type: "missing"
    pattern: "개발\\s*환경|컴파일러|컴파일\\s*옵션|빌드\\s*도구|GCC|Visual\\s*Studio"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS11.15, AS11.21"

  # --- [10. 생명주기 보증 후반부 및 11. 기타 공격 대응] ---
  - id: DOC-051
    doc_type: design
    name: "기능시험 및 자동화 보안 진단(취약점 점검) 명세"
    description: "개발업체가 수행하는 암호모듈 기능시험(벤더시험) 내역과 더불어, 자동화 보안 진단 도구(Yasca 등)를 이용하여 버퍼오버플로우에 취약한 함수(strcpy, strlen 등)를 점검하고 안전하게 보완한 내역이 서술되어야 함 (AS11.29, AS11.30)"
    pattern_type: "semantic"
    pattern: "자동화\\s*보안\\s*진단|취약점\\s*점검|취약한\\s*함수.*제거|벤더\\s*시험"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS11.29, AS11.30"

  - id: DOC-052
    doc_type: design
    name: "수명 종료 시의 안전한 소거 절차 상세 서술"
    description: "암호모듈의 사용이 완료된 후, 단순히 파일을 지우는 것을 넘어 운영체제 명령어(Windows의 cipher /w, Linux의 shred 등)를 이용하여 여러 번 덮어쓰는 방식으로 안전하게 소거하는 절차가 명세되어야 함 (AS11.36)"
    pattern_type: "semantic"
    pattern: "안전한\\s*소거|덮어쓰.*삭제|shred|cipher"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS11.36"

  - id: DOC-053
    doc_type: design
    name: "역할별 운영자 안내서(관리자/비관리자) 분리 제공 명세"
    description: "암호모듈을 안전하게 관리/설치하기 위한 '관리자 안내서'와 일반 사용자의 사용 책임 및 API 사용법을 명시한 '비관리자 안내서'가 각각 분리되어 제공됨이 명세되어야 함 (AS11.38, AS11.39)"
    pattern_type: "missing"
    pattern: "(?=.*관리자\\s*안내서)(?=.*비관리자\\s*안내서)"
    severity: medium
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS11.38, AS11.39"

  - id: DOC-054
    doc_type: design
    name: "공개키 타이밍 공격 및 키 노출(마스킹) 대응 명세"
    description: "RSA, DH 등 공개키 암호알고리즘 구현 시 발생하는 단순 시간차 공격(타이밍 공격)을 방어하기 위한 constant-time 연산(Laddering, 더미 연산 등) 기법과 하드코딩된 무결성 검증키의 노출을 막는 XOR 마스킹/분산 저장 기법이 서술되어야 함 (AS12.02)"
    pattern_type: "semantic"
    pattern: "시간차\\s*공격|타이밍\\s*공격|constant-time|더미\\s*연산|마스킹.*분산"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS12.02"

  - id: DOC-055
    doc_type: design
    name: "소프트웨어 버퍼오버플로우 구조적 방어 명세"
    description: "비정상적으로 많은 값을 입력하는 버퍼오버플로우 공격 등을 원천 차단하기 위해 응용프로그램으로부터 전달받는 입력 인자의 크기를 취득하여 데이터 형식 및 크기 검증을 수행하고, 실패 시 오류를 반환하는 구조적 방어 로직이 서술되어야 함 (AS12.02)"
    pattern_type: "semantic"
    pattern: "버퍼오버플로우.*오류|입력값\\s*형식검증|입력\\s*인자\\s*검사"
    severity: high
    kcmvp_ref: "2025 최신 암호모듈 제출물 작성 안내서 AS12.02"
